name: Fetch newsletter feeds

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch and parse feeds
        run: python3 .github/scripts/fetch-feeds.py

      - name: Commit feeds.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds.json
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "chore: update feeds.json [skip ci]" && git push
